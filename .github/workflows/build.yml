name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify_and_build:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Gradle Build Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/build-cache-1
          .gradle
        key: ${{ runner.os }}-gradle-build-cache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-gradle-build-cache-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Lint
      run: ./gradlew lintDebug --build-cache --parallel --stacktrace

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --build-cache --parallel --stacktrace

    - name: Build Debug APK
      run: ./gradlew assembleDebug --build-cache --parallel --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: custom-keyboard-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk